name: DPIKiller
options:
  deploymentTarget:
    macOS: "13.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 4.0.6
    CURRENT_PROJECT_VERSION: 4.0.6
targets:
  DPIKiller:
    type: application
    platform: macOS
    attributes:
      SystemCapabilities:
        com.apple.NetworkExtensions:
          enabled: 1
    sources:
      - path: main.swift
      - path: Sources
    info:
      path: Xcode/DPIKiller-Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: DPI Killer
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
    entitlements:
      path: DPIKiller.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.DPIKiller
        PRODUCT_NAME: DPIKiller
        INFOPLIST_FILE: Xcode/DPIKiller-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - sdk: AppKit.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - sdk: ServiceManagement.framework
      - target: DPIKillerNetworkHelper
      - target: DPIKillerTunnel
        embed: true
    postBuildScripts:
      - name: Embed Network Helper
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/HelperTools"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/DPIKillerNetworkHelper" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/HelperTools/DPIKillerNetworkHelper"
          cp "$SRCROOT/Helpers/NetworkSettings/com.antigravity.DPIKiller.NetworkHelper.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons/com.antigravity.DPIKiller.NetworkHelper.plist"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/DPIKillerNetworkHelper
          - $(SRCROOT)/Helpers/NetworkSettings/com.antigravity.DPIKiller.NetworkHelper.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/HelperTools/DPIKillerNetworkHelper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/com.antigravity.DPIKiller.NetworkHelper.plist
      - name: Copy App Icon
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/assets/AppIcon.icns" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns

  DPIKillerNetworkHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/NetworkSettings/main.swift
      - path: Sources/Shared/NetworkSettingsProtocol.swift
      - path: Sources/Services/SystemProxyController.swift
      - path: Sources/Core/BypassEngine.swift
      - path: Sources/Core/SettingsModels.swift
      - path: Sources/Core/Localization.swift
      - path: Sources/Core/Logging.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.DPIKiller.NetworkHelper
        PRODUCT_NAME: DPIKillerNetworkHelper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -D DPIKILLER_NETWORK_HELPER"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: Foundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework

  DPIKillerTunnel:
    type: app-extension
    platform: macOS
    attributes:
      SystemCapabilities:
        com.apple.NetworkExtensions:
          enabled: 1
    sources:
      - path: Extensions/PacketTunnel/Sources
      - path: Sources/Shared
    info:
      path: Extensions/PacketTunnel/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Extensions/PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.DPIKiller.PacketTunnel
        PRODUCT_NAME: DPIKillerTunnel
        INFOPLIST_FILE: Extensions/PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: Foundation.framework
      - sdk: NetworkExtension.framework

schemes:
  DPIKiller:
    build:
      targets:
        DPIKiller: all
        DPIKillerNetworkHelper: all
        DPIKillerTunnel: all
