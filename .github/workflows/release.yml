name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify source build
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build committed version
        run: SKIP_VERSION_BUMP=1 bash build.sh

      - name: Create DMG
        run: |
          bash scripts/create_dmg.sh

      - name: Save unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPIKiller-unsigned-ci
          path: DPIKiller.dmg
          retention-days: 7
      # Stable updates are signed and published by scripts/release.sh.
